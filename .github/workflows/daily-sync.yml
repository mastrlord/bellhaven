# Daily Bellhaven website -> CRM reconciliation.
# Not live for this exercise. The pipeline is read-only against the CRM; it only
# queues proposals. Writes happen when a reviewer approves them in the review app.
#
# State (data/state.db) holds proposals and reviewer decisions. It must persist
# between runs so decided items are never re-proposed. Here it is carried with the
# Actions cache; in production it would live in a shared database the review app
# also reads.

name: daily-bellhaven-sync

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 AM Central (5 AM during standard time); queue is ready before reviewers start
  workflow_dispatch: {}

concurrency:
  group: bellhaven-sync
  cancel-in-progress: false   # never let two runs write state at once

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore review state
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: bellhaven-state-${{ github.run_id }}
          restore-keys: bellhaven-state-

      - name: Run pipeline
        env:
          BH_API_TOKEN: ${{ secrets.BH_API_TOKEN }}
        run: python pipeline.py
